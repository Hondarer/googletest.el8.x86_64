name: Build GoogleTest Libraries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GOOGLETEST_VERSION_FILE: TARGET_GTEST_VERSION

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # os-name は CI と artifact の表示名、target-arch は配布ディレクトリ名に使用する。
          - os-name: ol8
            target-arch: el8
            image: ghcr.io/hondarer/oracle-linux-container/oracle-linux-8-dev:latest
          - os-name: ol9
            target-arch: el9
            image: ghcr.io/hondarer/oracle-linux-container/oracle-linux-9-dev:latest
          - os-name: ol10
            target-arch: el10
            image: ghcr.io/hondarer/oracle-linux-container/oracle-linux-10-dev:latest
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        HOST_USER: user
        HOST_UID: 1001
        HOST_GID: 127

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: googletest-lib

      - name: Read GoogleTest version
        id: version
        run: |
          cd googletest-lib
          VERSION=$(grep -v '^#' ${GOOGLETEST_VERSION_FILE} | grep -v '^$' | head -n 1 | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "git_tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "GoogleTest version: ${VERSION}"

      - name: Clone GoogleTest ${{ steps.version.outputs.version }}
        run: |
          git clone --branch ${{ steps.version.outputs.git_tag }} --depth 1 https://github.com/google/googletest.git googletest-source

      - name: Configure git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/googletest-lib"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/googletest-source"

      - name: Build GoogleTest (RelWithDebInfo)
        run: |
          mkdir -p build-linux
          cd build-linux
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_SHARED_LIBS=OFF \
            ../googletest-source
          make -j$(nproc)

      - name: Install GoogleTest
        run: |
          cd build-linux
          make install DESTDIR=./installed

      - name: Prepare Linux artifacts
        run: |
          mkdir -p artifacts/linux_${{ matrix.target-arch }}_x64
          cp -r build-linux/installed/usr/local/lib*/* artifacts/linux_${{ matrix.target-arch }}_x64/
          cp -r build-linux/installed/usr/local/include artifacts/

      - name: Upload Linux libraries
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.os-name }}-libraries
          path: artifacts/linux_${{ matrix.target-arch }}_x64
          if-no-files-found: error

      - name: Upload include files
        uses: actions/upload-artifact@v7
        if: matrix.os-name == 'ol8'
        with:
          name: include-files
          path: artifacts/include
          if-no-files-found: error

  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: googletest-lib

      - name: Read GoogleTest version
        id: version
        run: |
          cd googletest-lib
          $VERSION = (Get-Content ${env:GOOGLETEST_VERSION_FILE} | Where-Object { $_ -notmatch '^\s*#' -and $_ -notmatch '^\s*$' } | Select-Object -First 1).Trim()
          echo "version=${VERSION}" >> $env:GITHUB_OUTPUT
          echo "git_tag=v${VERSION}" >> $env:GITHUB_OUTPUT
          echo "GoogleTest version: ${VERSION}"
        shell: pwsh

      - name: Clone GoogleTest ${{ steps.version.outputs.version }}
        run: |
          git clone --branch ${{ steps.version.outputs.git_tag }} --depth 1 https://github.com/google/googletest.git googletest-source
        shell: bash

      - name: Setup MSVC environment
        run: |
          & "${{ github.workspace }}\googletest-lib\.github\scripts\Add-VSBT-Env-x64.ps1"
        shell: pwsh

      - name: Build GoogleTest (MD - RelWithDebInfo)
        run: |
          mkdir build-md
          cd build-md
          cmake -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -Dgtest_force_shared_crt=ON `
            ../googletest-source
          nmake
          cmake --install . --prefix ./installed
        shell: pwsh

      - name: Build GoogleTest (MDd - Debug)
        run: |
          mkdir build-mdd
          cd build-mdd
          cmake -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Debug `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDebugDLL `
            -Dgtest_force_shared_crt=ON `
            ../googletest-source
          nmake
          cmake --install . --prefix ./installed
        shell: pwsh

      - name: Build GoogleTest (MT - RelWithDebInfo)
        run: |
          mkdir build-mt
          cd build-mt
          cmake -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -Dgtest_force_shared_crt=OFF `
            ../googletest-source
          nmake
          cmake --install . --prefix ./installed
        shell: pwsh

      - name: Build GoogleTest (MTd - Debug)
        run: |
          mkdir build-mtd
          cd build-mtd
          cmake -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Debug `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDebug `
            -Dgtest_force_shared_crt=OFF `
            ../googletest-source
          nmake
          cmake --install . --prefix ./installed
        shell: pwsh

      - name: Prepare Windows artifacts
        run: |
          mkdir -p artifacts/windows_x64/md
          mkdir -p artifacts/windows_x64/mdd
          mkdir -p artifacts/windows_x64/mt
          mkdir -p artifacts/windows_x64/mtd
          Copy-Item -Recurse -Path "build-md/installed/lib/*" -Destination "artifacts/windows_x64/md/"
          Copy-Item -Recurse -Path "build-mdd/installed/lib/*" -Destination "artifacts/windows_x64/mdd/"
          Copy-Item -Recurse -Path "build-mt/installed/lib/*" -Destination "artifacts/windows_x64/mt/"
          Copy-Item -Recurse -Path "build-mtd/installed/lib/*" -Destination "artifacts/windows_x64/mtd/"
          # Copy PDB files
          Copy-Item -Path "build-md/lib/*.pdb" -Destination "artifacts/windows_x64/md/" -ErrorAction SilentlyContinue
          Copy-Item -Path "build-mdd/lib/*.pdb" -Destination "artifacts/windows_x64/mdd/" -ErrorAction SilentlyContinue
          Copy-Item -Path "build-mt/lib/*.pdb" -Destination "artifacts/windows_x64/mt/" -ErrorAction SilentlyContinue
          Copy-Item -Path "build-mtd/lib/*.pdb" -Destination "artifacts/windows_x64/mtd/" -ErrorAction SilentlyContinue
          # Rename incorrectly named PDB files in Debug builds
          Get-ChildItem -Path "artifacts/windows_x64/mdd" -Filter "*pdb_debug_postfix-NOTFOUND.pdb" | ForEach-Object {
            $newName = $_.Name -replace 'pdb_debug_postfix-NOTFOUND\.pdb$', '.pdb'
            Rename-Item -Path $_.FullName -NewName $newName
          }
          Get-ChildItem -Path "artifacts/windows_x64/mtd" -Filter "*pdb_debug_postfix-NOTFOUND.pdb" | ForEach-Object {
            $newName = $_.Name -replace 'pdb_debug_postfix-NOTFOUND\.pdb$', '.pdb'
            Rename-Item -Path $_.FullName -NewName $newName
          }
        shell: pwsh

      - name: Upload Windows libraries
        uses: actions/upload-artifact@v7
        with:
          name: windows-libraries
          path: artifacts/windows_x64
          if-no-files-found: error

  commit-changes:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean lib directory
        run: |
          # lib ディレクトリをクリーンアップ
          # Clean lib directory before downloading new artifacts
          rm -rf lib/
          mkdir -p lib/

      - name: Clean include directory
        run: |
          # include ディレクトリをクリーンアップ
          # Clean include directory before downloading new artifacts
          rm -rf include/
          mkdir -p include/

      - name: Download Linux OL8 libraries
        uses: actions/download-artifact@v8
        with:
          name: linux-ol8-libraries
          path: lib/linux_el8_x64/

      - name: Download Linux OL9 libraries
        uses: actions/download-artifact@v8
        with:
          name: linux-ol9-libraries
          path: lib/linux_el9_x64/

      - name: Download Linux OL10 libraries
        uses: actions/download-artifact@v8
        with:
          name: linux-ol10-libraries
          path: lib/linux_el10_x64/

      - name: Download Windows libraries
        uses: actions/download-artifact@v8
        with:
          name: windows-libraries
          path: lib/windows_x64/

      - name: Download include files
        uses: actions/download-artifact@v8
        with:
          name: include-files
          path: include/

      - name: Generate documentation from templates
        run: |
          chmod +x .github/scripts/generate_docs.sh
          ./.github/scripts/generate_docs.sh

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          # lib, include, ドキュメントの変更を確認
          if [ -n "$(git status --porcelain lib/ include/ README.md docs/)" ]; then
            echo "Library, include, and documentation changes detected"
            git add -A lib/ include/ README.md docs/
            git commit -m "ビルド済みライブラリとドキュメントを更新"
            git push
          else
            echo "No changes to commit"
          fi
